name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required application files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s service-worker.js
      - name: Check required UI hooks
        shell: bash
        run: |
          grep -q 'id="shareScreen"' index.html
          grep -q 'getDisplayMedia' app.js
          grep -q 'profileModal' app.js
