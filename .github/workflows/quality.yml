name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check realtime.js
          node --check server/src/server.mjs
          node --check cloudflare/src/worker.js
          node --check scripts/prepare-dist.mjs
      - name: Validate JSON configuration
        run: node -e "for (const file of ['package.json','server/package.json','manifest.webmanifest','cloudflare/wrangler.jsonc','src-tauri/tauri.conf.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"
      - name: Prepare packaged frontend
        run: npm run prepare:dist
      - name: Check required application files
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/realtime.js
          test -s dist/runtime-config.js
          test -s dist/assets/icon.svg
      - name: Check required UI hooks
        shell: bash
        run: |
          grep -q 'id="shareScreen"' index.html
          grep -q 'id="installApp"' index.html
          grep -q 'getDisplayMedia' app.js
          grep -q 'beforeinstallprompt' app.js
          grep -q 'profileModal' app.js
          grep -q 'RTCPeerConnection' realtime.js
      - name: Test multiuser server
        run: node server/tests/smoke.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/enantato-worker
      - name: Validate Docker deployment
        env:
          APP_DOMAIN: enantato.example.com
          APP_ORIGIN: https://enantato.example.com
          ICE_SERVERS: '[{"urls":"stun:stun.l.google.com:19302"}]'
        run: |
          docker compose config --quiet
          docker build --file server/Dockerfile --tag enantato-server:test .

  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        run: npm install
      - name: Generate native icons
        run: npm run desktop:icons
      - name: Prepare packaged frontend
        run: npm run prepare:dist
      - name: Check desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
