name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install application dependencies
        run: npm install

      - name: Generate native icons
        run: npm run desktop:icons

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Enantato v__VERSION__"
          releaseBody: "Baixe o arquivo de instalação do Windows nos anexos desta versão."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
