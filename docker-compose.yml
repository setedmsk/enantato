services:
  enantato:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      PUBLIC_DIR: /app/public
      APP_ORIGIN: ${APP_ORIGIN}
      ICE_SERVERS: ${ICE_SERVERS}
    volumes:
      - enantato-data:/app/data
    expose:
      - "8787"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - enantato
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  enantato-data:
  caddy-data:
  caddy-config:
